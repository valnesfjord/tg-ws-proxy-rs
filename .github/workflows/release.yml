name: Release

permissions:
    contents: write

on:
    push:
        tags:
            - v[0-9]+.*

jobs:
    # Created as a draft: the assets below take minutes to build, and a
    # published release with no binaries under it is worse than no release yet.
    # `publish-release` flips it once every asset has landed.
    #
    # The body comes from the base-version notes committed alongside the version
    # bump, so a release cannot ship with the previous version's text or none at
    # all. Beta tags reuse that file with a temporary tag-specific heading. The
    # bare heading is required because parse-changelog does not recognise one
    # carrying the crate name; the name lives in `title` instead.
    create-release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Prepare tag-specific release notes
              id: release-notes
              shell: bash
              run: |
                  output="${RUNNER_TEMP}/release-notes.md"
                  .github/scripts/prepare-release-notes.sh "${GITHUB_REF_NAME}" "$output"
                  echo "path=$output" >> "$GITHUB_OUTPUT"
            - uses: taiki-e/create-gh-release-action@v1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  changelog: ${{ steps.release-notes.outputs.path }}
                  title: tg-ws-proxy-rs $tag
                  draft: true

    upload-assets:
        needs: create-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: aarch64-unknown-linux-musl
                      os: ubuntu-latest
                    - target: aarch64-apple-darwin
                      os: macos-latest
                    - target: x86_64-unknown-linux-musl
                      os: ubuntu-latest
                    - target: mipsel-unknown-linux-musl
                      os: ubuntu-latest
                    - target: armv7-unknown-linux-musleabihf
                      os: ubuntu-latest
                    - target: armv7-unknown-linux-musleabi
                      os: ubuntu-latest
                    - target: x86_64-apple-darwin
                      os: macos-latest
                    - target: x86_64-pc-windows-gnu
                      os: windows-latest
                    - target: universal-apple-darwin
                      os: macos-latest
                    - target: mips-unknown-linux-musl
                      os: ubuntu-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6

            - name: Read pinned Rust toolchain
              if: matrix.target != 'mipsel-unknown-linux-musl' && matrix.target != 'mips-unknown-linux-musl'
              id: rust-toolchain
              shell: bash
              run: |
                  toolchain="$(sed -n -E 's/^channel = "(.+)"/\1/p' rust-toolchain.toml)"
                  test -n "$toolchain"
                  echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

            - name: Install pinned Rust
              if: matrix.target != 'mipsel-unknown-linux-musl' && matrix.target != 'mips-unknown-linux-musl'
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}

            # Default path (all targets except the mips variants)
            - name: Build & upload (default)
              if: matrix.target != 'mipsel-unknown-linux-musl' && matrix.target != 'mips-unknown-linux-musl'
              uses: taiki-e/upload-rust-binary-action@v1
              with:
                  bin: tg-ws-proxy
                  target: ${{ matrix.target }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            # Special path for mipsel: nightly + build-std, then upload via gh cli
            - name: Install nightly + rust-src (mipsel and mips)
              if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rust-src

            - name: Install cross (mipsel and mips)
              if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
              run: cargo install cross --locked

            # `crt-static` is not the default on the mips musl targets the way it
            # is on every other musl target here, and switching it on alone fails:
            # rustc then names crt1.o/crti.o/crtn.o out of the self-contained
            # directory that ships with rust-std, which these tier-3 targets do not
            # have and -Z build-std does not produce. `link-self-contained=no` hands
            # that job back to gcc, which does have them, and leaves rustc asking
            # for -lunwind -- the LLVM unwinder, where these images carry GCC's
            # libgcc_eh.a. Cross.toml aliases the one to the other.
            #
            # Without this the binaries need /lib/ld-musl-mips*-sf.so.1 and
            # libgcc_s.so.1 on the device. OpenWrt has both; other firmware does
            # not, which is what made this proxy unrunnable there.
            - name: Build (mipsel, build-std)
              if: matrix.target == 'mipsel-unknown-linux-musl'
              env:
                  RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
              run: cross +nightly build --release --bin tg-ws-proxy --target mipsel-unknown-linux-musl -Z build-std=std,panic_abort

            - name: Build (mips, build-std)
              if: matrix.target == 'mips-unknown-linux-musl'
              env:
                  RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
              run: cross +nightly build --release --bin tg-ws-proxy --target mips-unknown-linux-musl -Z build-std=std,panic_abort

            - name: Inspect build output (mips variants)
              if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
              run: |
                  FILE="target/${{ matrix.target }}/release/tg-ws-proxy"
                  ls -lah "target/${{ matrix.target }}/release/" || true
                  test -f "$FILE"
                  file "$FILE"

                  # Nothing downstream would catch a regression here: a dynamic
                  # build still runs fine on OpenWrt, which is exactly how this
                  # shipped unnoticed for as long as it did.
                  if readelf -d "$FILE" | grep -q NEEDED; then
                      echo "::error::$FILE is dynamically linked; expected a static binary"
                      readelf -d "$FILE" | grep NEEDED
                      exit 1
                  fi

            - name: Upload to GitHub Release (mips variants)
              if: matrix.target == 'mipsel-unknown-linux-musl' || matrix.target == 'mips-unknown-linux-musl'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euxo pipefail
                  TAG="${GITHUB_REF_NAME}"
                  NAME="tg-ws-proxy-${{ matrix.target }}"
                  TMPDIR="$(mktemp -d)"
                  cp "target/${{ matrix.target }}/release/tg-ws-proxy" "${TMPDIR}/tg-ws-proxy"
                  tar -C "${TMPDIR}" -czf "${NAME}.tar.gz" tg-ws-proxy
                  gh release upload "$TAG" "${NAME}.tar.gz" --clobber

    # Needs `create-release` and nothing else: the APKs share no artifact with
    # the musl builds, so this runs beside `upload-assets` rather than behind
    # it and costs the release roughly no extra wall clock. `publish-release`
    # lists it, which is what makes a failure here leave a draft instead of a
    # published release that silently shipped without an APK -- how 2.3.0 would
    # otherwise have gone out.
    android:
        needs: create-release
        runs-on: ubuntu-latest
        env:
            # A secret that does not exist expands to the empty string. Nothing
            # below branches on these four directly: the step that opens the job
            # collapses them into one all-or-none answer, `TG_ANDROID_SIGNED`.
            # See docs/Android.md for the secrets a maintainer creates to turn
            # this into a signed build.
            TG_ANDROID_KEYSTORE_BASE64: ${{ secrets.TG_ANDROID_KEYSTORE_BASE64 }}
            TG_ANDROID_STORE_PASSWORD: ${{ secrets.TG_ANDROID_STORE_PASSWORD }}
            TG_ANDROID_KEY_ALIAS: ${{ secrets.TG_ANDROID_KEY_ALIAS }}
            TG_ANDROID_KEY_PASSWORD: ${{ secrets.TG_ANDROID_KEY_PASSWORD }}
        steps:
            - uses: actions/checkout@v6

            # ReleaseSigning calls signing configured only when all four of
            # storeFile/storePassword/keyAlias/keyPassword are present and
            # non-blank, so a partial set is not a mostly-signed build: AGP
            # falls back to the `-unsigned` outputs, the staging loop below
            # renames them honestly, the count assertion still passes, and the
            # release goes out unsigned with nothing in the log to say so. One
            # misspelled `TG_ANDROID_KEY_ALIAS` is enough. Decide here instead,
            # once, and refuse the middle case rather than publish it.
            #
            # Only the names of the secrets are ever printed; presence is
            # tested, content never is.
            - name: Decide whether this is a signed build
              shell: bash
              run: |
                  set -euo pipefail
                  present=()
                  missing=()
                  for name in TG_ANDROID_KEYSTORE_BASE64 TG_ANDROID_STORE_PASSWORD \
                              TG_ANDROID_KEY_ALIAS TG_ANDROID_KEY_PASSWORD; do
                      if [[ -n "${!name:-}" ]]; then
                          present+=("$name")
                      else
                          missing+=("$name")
                      fi
                  done

                  if [[ "${#missing[@]}" -eq 0 ]]; then
                      echo "TG_ANDROID_SIGNED=1" >> "$GITHUB_ENV"
                      echo "All four Android signing secrets are set; the APKs must come out signed." \
                          >> "$GITHUB_STEP_SUMMARY"
                  elif [[ "${#present[@]}" -eq 0 ]]; then
                      echo "TG_ANDROID_SIGNED=0" >> "$GITHUB_ENV"
                      echo "::warning::no Android signing secrets are set; this release will carry unsigned APKs"
                      {
                          echo "**This release carries unsigned Android APKs.**"
                          echo "No signing secret is set, so the APKs are named \`-unsigned\` and"
                          echo "Android will not install them without \`adb install\`."
                          echo "See docs/Android.md for the four secrets that turn signing on."
                      } >> "$GITHUB_STEP_SUMMARY"
                  else
                      echo "::error::Android signing is half-configured -- set: ${present[*]}; missing or blank: ${missing[*]}. Set all four secrets or none; anything between silently produces unsigned APKs."
                      exit 1
                  fi

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"

            # Performs the Gradle wrapper JAR checksum validation, same as CI.
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            # The runner images ship a single NDK and bump it without notice,
            # which silently changes the toolchain the native library is built
            # with. The version lives in android/gradle/libs.versions.toml and
            # is read here, by the convention plugin, and by the F-Droid
            # recipe.
            - name: Install pinned Android NDK
              shell: bash
              run: |
                  set -euo pipefail
                  ndk="$(sed -n -E 's/^ndk = "(.+)"/\1/p' android/gradle/libs.versions.toml)"
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

            - name: Read pinned Rust toolchain
              id: rust-toolchain
              shell: bash
              run: |
                  toolchain="$(sed -n -E 's/^channel = "(.+)"/\1/p' rust-toolchain.toml)"
                  test -n "$toolchain"
                  echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

            - name: Set up Rust
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}

            # A keystore is a binary file, so the secret carries it base64-encoded
            # and only the path reaches Gradle. No `set -x` anywhere in this job:
            # the trace would put the encoded keystore in the log.
            - name: Decode the release keystore
              if: ${{ env.TG_ANDROID_SIGNED == '1' }}
              shell: bash
              run: |
                  set -euo pipefail
                  keystore="${RUNNER_TEMP}/release.jks"
                  # Set before the redirection creates the file, so it is never
                  # briefly world-readable on a shared runner.
                  umask 077
                  printf '%s' "$TG_ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
                  echo "TG_ANDROID_STORE_FILE=${keystore}" >> "$GITHUB_ENV"

            # Release only: the per-ABI plus universal APK set, R8-minified.
            - name: Build the release APKs
              working-directory: android
              shell: bash
              run: ./gradlew :app:assembleRelease

            - name: Stage and upload the APKs
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  version="${GITHUB_REF_NAME#v}"
                  out=android/app/build/outputs/apk/release
                  stage="$(mktemp -d)"
                  count=0
                  # AGP names the outputs after the module and appends -unsigned
                  # when no keystore was configured, so read what it actually
                  # wrote rather than guessing at the suffix -- that is what
                  # lets the signed and unsigned shapes share one code path.
                  # `-android-` in the released name because the OpenWrt LuCI
                  # packages on the same release page are also called .apk.
                  while read -r file; do
                      abi="${file#app-}"
                      abi="${abi%%-release*}"
                      suffix=""
                      [[ "$file" == *-unsigned.apk ]] && suffix="-unsigned"

                      # The gate step already refused a half-configured secret
                      # set, so what AGP wrote and what we asked for can only
                      # disagree if AGP or ReleaseSigning changed under us --
                      # and the whole point of that gate is that the disagreement
                      # is invisible downstream. Say it here rather than upload.
                      if [[ "$TG_ANDROID_SIGNED" == "1" && -n "$suffix" ]]; then
                          echo "::error::${file}: AGP produced an unsigned APK although every signing secret was supplied"
                          exit 1
                      fi
                      if [[ "$TG_ANDROID_SIGNED" == "0" && -z "$suffix" ]]; then
                          echo "::error::${file}: AGP produced a signed APK although no signing secret was supplied"
                          exit 1
                      fi

                      cp "$out/$file" "$stage/tg-ws-proxy-rs-android-${version}-${abi}${suffix}.apk"
                      count=$((count + 1))
                  done < <(jq -r '.elements[].outputFile' "$out/output-metadata.json")

                  # Three ABIs plus the universal APK. CI's `android` job owns
                  # the checks that each one carries the right .so and the right
                  # JNI symbols; this only guards against uploading a set that
                  # quietly shrank.
                  if [[ "$count" -ne 4 ]]; then
                      echo "::error::expected 4 release APKs, got ${count}"
                      exit 1
                  fi

                  gh release upload "${GITHUB_REF_NAME}" "$stage"/*.apk \
                      --repo "${GITHUB_REPOSITORY}" --clobber

            # RUNNER_TEMP is wiped when the job ends, but only on a healthy
            # runner; deleting the keystore explicitly does not depend on that.
            - name: Remove the decoded keystore
              if: ${{ always() }}
              shell: bash
              run: rm -f "${RUNNER_TEMP}/release.jks"

    # Builds its two packages from the tree, not from the musl tarballs, so the
    # only thing it needs is somewhere to upload them. It used to wait on
    # `upload-assets` and `compress-assets` because it also built SHA256SUMS out
    # of the assets they had uploaded; `checksums` owns that now, and this runs
    # beside them again.
    openwrt-luci:
        needs: create-release
        runs-on: ubuntu-latest
        env:
            APK_VERSION: 25.12.5
            APK_SDK_FILE: openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            APK_SDK_SHA256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
            IPK_VERSION: 24.10.5
            IPK_SDK_FILE: openwrt-sdk-24.10.5-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            IPK_SDK_SHA256: 0fa98c542ee07f1423ebcdce19aed464bc7f8008ef2cbe83cb723ec694ed8c56
        steps:
            - uses: actions/checkout@v6

            - name: Download and verify OpenWrt SDKs
              shell: bash
              run: |
                  set -euo pipefail
                  for kind in APK IPK; do
                      version_var="${kind}_VERSION"
                      file_var="${kind}_SDK_FILE"
                      sha_var="${kind}_SDK_SHA256"
                      version="${!version_var}"
                      file="${!file_var}"
                      sha="${!sha_var}"
                      base="https://downloads.openwrt.org/releases/${version}/targets/mediatek/filogic"
                      curl -fsSLO "${base}/${file}"
                      printf '%s  %s\n' "$sha" "$file" | sha256sum -c -
                      tar --zstd -xf "$file"
                      sdk_dir="${PWD}/${file%.tar.zst}"
                      test -f "${sdk_dir}/include/package.mk"
                      printf 'OPENWRT_%s_SDK=%s\n' "$kind" "$sdk_dir" >> "$GITHUB_ENV"
                  done

            - name: Build and verify LuCI integration packages
              shell: bash
              run: |
                  set -euo pipefail
                  version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
                  apk_version="$version"
                  ipk_version="$version"
                  case "${GITHUB_REF_NAME}" in
                      "v${version}") ;;
                      "v${version}-beta."[1-9]*)
                          tag_version="${GITHUB_REF_NAME#v}"
                          beta="${tag_version#"$version-beta."}"
                          apk_version="${version}_beta${beta}"
                          ipk_version="${version}~beta.${beta}"
                      ;;
                      *) echo "::error::unsupported release tag ${GITHUB_REF_NAME}"; exit 1 ;;
                  esac
                  final="${PWD}/dist/openwrt"
                  rm -rf "$final"
                  mkdir -p "$final"
                  openwrt/build-luci-package.sh \
                      --sdk "$OPENWRT_APK_SDK" \
                      --version "$apk_version" \
                      --format apk \
                      --output "$final"
                  openwrt/build-luci-package.sh \
                      --sdk "$OPENWRT_IPK_SDK" \
                      --version "$ipk_version" \
                      --format ipk \
                      --output "$final"

                  (
                      cd "$final"
                      set -- luci-app-tg-ws-proxy-rs-*.apk
                      [[ "$#" -eq 1 && -f "$1" ]]
                      set -- luci-app-tg-ws-proxy-rs_*.ipk
                      [[ "$#" -eq 1 && -f "$1" ]]
                  )

            - name: Upload the LuCI packages
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  gh release upload "${GITHUB_REF_NAME}" \
                      dist/openwrt/luci-app-tg-ws-proxy-rs-*.apk \
                      dist/openwrt/luci-app-tg-ws-proxy-rs_*.ipk \
                      --repo "${GITHUB_REPOSITORY}" --clobber

    # Extra UPX-packed assets for flash-constrained devices (OpenWrt routers).
    #
    # These do not replace the plain assets: packing trades RAM for flash. A
    # normal ELF maps its text from the file, so only the working set is
    # resident and those pages can be evicted under pressure; the UPX stub
    # decompresses the whole image into anonymous memory instead, which on a
    # router with no swap stays resident for the life of the process. Good deal
    # on a 128 MB device with 8 MB of flash, bad one on a 32 MB device — so the
    # choice belongs to whoever is doing the flashing.
    #
    # Windows and macOS are deliberately excluded: UPX-packed PE files trip
    # antivirus heuristics, which is unacceptable for a censorship-circumvention
    # tool, and packing a Mach-O invalidates its signature so arm64 macOS
    # refuses to run it at all.
    compress-assets:
        # `create-release` is already an ancestor through `upload-assets`; it is
        # named here so the guard below can read its result.
        needs: [create-release, upload-assets]
        # Not `success()`: upload-assets covers Windows and macOS too, and a
        # hiccup there should not silently drop every `-upx` asset. Each leg
        # below fails on its own if its plain asset never made it to the release.
        #
        # A failed `create-release` is the one case worth skipping for. A
        # skipped dependency is not a cancellation, so `!cancelled()` alone
        # would start all five legs against a release that was never created
        # and each would die on a raw `gh release download` error -- five red
        # jobs whose logs point at `gh` rather than at the job that broke.
        if: ${{ !cancelled() && needs.create-release.result == 'success' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: mipsel-unknown-linux-musl
                      qemu: qemu-mipsel-static
                    - target: mips-unknown-linux-musl
                      qemu: qemu-mips-static
                    - target: armv7-unknown-linux-musleabihf
                      qemu: qemu-arm-static
                    # Run on a Cortex-A9 with VFP and NEON switched off -- bcm53xx,
                    # the routers this build exists for -- rather than on QEMU's
                    # default CPU, which has every extension there is.
                    - target: armv7-unknown-linux-musleabi
                      qemu: qemu-arm-static
                      qemu_cpu: cortex-a9,vfp=off,vfp-d32=off,neon=off
                    - target: aarch64-unknown-linux-musl
                      qemu: qemu-aarch64-static
                    - target: x86_64-unknown-linux-musl
                      qemu: qemu-x86_64-static
        steps:
            # Only the scripts are needed, not a full working tree -- but `gh`
            # also refuses to infer the repository without one, hence --repo on
            # every gh call below.
            - uses: actions/checkout@v6

            - name: Install UPX and qemu-user-static
              env:
                  UPX_VERSION: 5.2.0
                  UPX_SHA256: 3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1
              shell: bash
              run: |
                  set -euxo pipefail
                  curl -fsSL -o upx.tar.xz \
                      "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
                  echo "${UPX_SHA256}  upx.tar.xz" | sha256sum -c -
                  tar -xJf upx.tar.xz
                  sudo install -m 0755 "upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/upx
                  sudo apt-get update
                  sudo apt-get install -y qemu-user-static

            - name: Pack, verify and upload
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euxo pipefail
                  TAG="${GITHUB_REF_NAME}"
                  NAME="tg-ws-proxy-${{ matrix.target }}"
                  WORK="$(mktemp -d)"

                  gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" \
                      --pattern "${NAME}.tar.gz" --dir "$WORK"
                  tar -C "$WORK" -xzf "${WORK}/${NAME}.tar.gz"
                  test -f "${WORK}/tg-ws-proxy"

                  .github/scripts/pack-verify.sh "${WORK}/tg-ws-proxy" ${{ matrix.qemu }} "${{ matrix.qemu_cpu }}"

                  tar -C "$WORK" -czf "${NAME}-upx.tar.gz" tg-ws-proxy
                  gh release upload "$TAG" "${NAME}-upx.tar.gz" \
                      --repo "${GITHUB_REPOSITORY}" --clobber

    # The release publishes exactly one checksum file, so it can only be built
    # once the last asset has landed -- every job that uploads one is in `needs`,
    # plus `create-release` so the guard below can read its result.
    #
    # This used to live inside `openwrt-luci`, which hashed the files in its own
    # staging directory plus the musl tarballs it pulled down for that purpose.
    # Anything uploaded by a job it did not wait on was therefore missing from
    # SHA256SUMS: the macOS and Windows archives, and -- once the `android` job
    # existed -- all four APKs. A sideloaded APK is exactly the asset where a
    # user most needs an out-of-band hash to check, so it shipped without one.
    #
    # Hashing what the release serves rather than what each job built is the
    # trick `compress-assets` already uses to reach the plain tarballs: read the
    # still-draft release back. It needs no working tree, and it means the
    # hashes cover the bytes a user actually downloads.
    checksums:
        needs: [create-release, upload-assets, compress-assets, openwrt-luci, android]
        # Not `success()`: a failure in one packaging path should surface as a
        # failing checksum job over a short asset set, not as a release whose
        # other assets quietly lost their hashes. `publish-release` waits on
        # this too, so either way the release stays a draft.
        #
        # `create-release` is excluded from that: with no draft there is nothing
        # to read back and nothing to hash, so running would only add a raw `gh`
        # error pointing away from the job that actually failed.
        if: ${{ !cancelled() && needs.create-release.result == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - name: Hash every asset on the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  dir="$(mktemp -d)"
                  gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
                      --dir "$dir" --clobber
                  cd "$dir"

                  # A re-run finds the previous SHA256SUMS among the assets, and
                  # a file cannot list its own hash.
                  rm -f SHA256SUMS

                  shopt -s nullglob
                  all=(*)
                  musl=(tg-ws-proxy-*-unknown-linux-musl*.tar.gz)
                  apks=(tg-ws-proxy-rs-android-*.apk)
                  luci=(luci-app-tg-ws-proxy-rs-*.apk luci-app-tg-ws-proxy-rs_*.ipk)

                  # 10 archives from `upload-assets`, 6 `-upx` ones from
                  # `compress-assets`, 2 LuCI packages, 4 APKs. The total is what
                  # catches an asset from the four macOS/Windows targets going
                  # missing without spelling out archive names this job never
                  # chose; the per-group counts say which path came up short.
                  if [[ "${#all[@]}" -ne 22 || "${#musl[@]}" -ne 12 ||
                        "${#apks[@]}" -ne 4 || "${#luci[@]}" -ne 2 ]]; then
                      echo "::error::release carries ${#all[@]} assets, expected 22: ${#musl[@]}/12 musl tarballs, ${#apks[@]}/4 APKs, ${#luci[@]}/2 LuCI packages"
                      printf '%s\n' "${all[@]}"
                      exit 1
                  fi

                  # Written elsewhere first: `> SHA256SUMS` would create the file
                  # before `*` is expanded on some shells, and it would then hash
                  # its own empty self.
                  sha256sum -- * > "${RUNNER_TEMP}/SHA256SUMS"
                  mv "${RUNNER_TEMP}/SHA256SUMS" SHA256SUMS
                  sha256sum -c SHA256SUMS

                  gh release upload "${GITHUB_REF_NAME}" SHA256SUMS \
                      --repo "${GITHUB_REPOSITORY}" --clobber

    # Every asset job must succeed, so a target, OpenWrt package set or Android
    # APK that failed to build leaves the release a draft rather than publishing
    # a half-populated one. Finish the job by hand (or re-run the failed leg) and
    # the draft is still there.
    publish-release:
        needs: [upload-assets, openwrt-luci, compress-assets, android, checksums]
        runs-on: ubuntu-latest
        steps:
            - name: Publish the draft now that every asset is uploaded
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euxo pipefail
                  gh release edit "${GITHUB_REF_NAME}" \
                      --repo "${GITHUB_REPOSITORY}" --draft=false
